[project]
name = "nlp-automl-optuna"
version = "0.1.0"
description = "AutoML for text classification with Optuna"
authors = [{name = "Your Name"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["typer>=0.12","pandas>=2.2","scikit-learn>=1.4","optuna>=3.6","joblib>=1.3"]
[project.optional-dependencies]
dev = ["pytest>=7.4","ruff>=0.5.0"]
[project.scripts]
nlp_automl_optuna = "nlp_automl_optuna.cli:app"
[tool.ruff]
line-length = 100
lint.select = ["E","F","I","B"]
lint.ignore = ["B008"]
[tool.pytest.ini_options]
testpaths = ["tests"]
